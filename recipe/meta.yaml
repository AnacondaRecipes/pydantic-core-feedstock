# Keep the version in sync with pydantic-feedstock because the latest version can be incompatible.
{% set name = "pydantic-core" %}
{% set version = "2.47.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
  sha256: 422c1797a7864b2a9a996435aba92fe571fb80190f67a31edbc1ac040c7b51fe

build:
  number: 0
  script:
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
  skip: true  # [py<310]

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler("c") }}
    - {{ compiler("rust") }}
    - cargo-bundle-licenses
  host:
    - pip
    - python
    - maturin >=1.13.3,<2
  run:
    - python
    - typing-extensions >=4.14.1

#E   pytest.PytestUnknownMarkWarning: Unknown pytest.mark.thread_unsafe - is this a typo?
# Instead of skipping those (since no pytest-run-parallel), we'll downgrade that single
# error back to warning status (warning-as-error).
test:
  source_files:
    - tests
    - pyproject.toml
  imports:
    - pydantic_core
  commands:
    - pip check
    - python -c "from pydantic_core import PydanticUndefinedType"
    # downgrade back to warning severity (error as warning) instead of skipping ignored_tests (comment above).
    - pytest -vv --ignore=tests/test_docstrings.py -W default::pytest.PytestUnknownMarkWarning
  requires:
    - pip
    - pytest
    - hypothesis
    - typing-inspection
    - dirty-equals
    - pytest-benchmark
    - pytest-timeout
    - pytest-mock
    - inline-snapshot

about:
  home: https://github.com/pydantic/pydantic
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Core validation logic for pydantic written in rust
  description: |
    This package provides the core functionality for pydantic validation and serialization.
  dev_url: https://github.com/pydantic/pydantic
  doc_url: https://pydantic.dev/docs
  
extra:
  recipe-maintainers:
    - xhochy
    - samuelcolvin
    - adriangb
    - dmontagu
    - pavelzw
